<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI/CD Deployment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff512f,#dd2476,#24c6dc,#514a9d);
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
    overflow:hidden;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:700px;
    max-width:90%;
    text-align:center;
    padding:60px 40px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border-radius:24px;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    color:white;
}

.icon{
    font-size:80px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

h1{
    margin-top:20px;
    font-size:48px;
    font-weight:700;
}

.highlight{
    color:#ffe066;
}

p{
    margin-top:20px;
    font-size:22px;
    color:#f8f9fa;
    line-height:1.6;
}

.badge{
    display:inline-block;
    margin-top:35px;
    padding:14px 32px;
    background:#22c55e;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(34,197,94,.6);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
        box-shadow:0 0 20px rgba(34,197,94,.6);
    }
    50%{
        transform:scale(1.08);
        box-shadow:0 0 35px rgba(34,197,94,.9);
    }
    100%{
        transform:scale(1);
        box-shadow:0 0 20px rgba(34,197,94,.6);
    }
}

.footer{
    margin-top:35px;
    color:#f1f5f9;
    font-size:18px;
}
</style>
</head>

<body>

<div class="card">

<div class="icon">🚀</div>

<h1>
The <span class="highlight">CI/CD Deployment</span><br>
is Working! 🎉
</h1>

<p>
Your AWS CodePipeline successfully deployed this website.<br><br>
<strong>Huehuehue 😎</strong>
</p>

<div class="badge">
✅ Deployment Successful
</div>

<div class="footer">
Built with ❤️ using GitHub • AWS CodePipeline • CodeBuild • Amazon S3
</div>

</div>

</body>
</html>
