<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Status</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .container{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            padding:40px;
            border-radius:18px;
            text-align:center;
            width:420px;
            box-shadow:0 10px 30px rgba(0,0,0,.4);
        }

        h1{
            font-size:28px;
            margin-bottom:10px;
        }

        p{
            color:#d1d5db;
            margin-bottom:30px;
        }

        .spinner{
            width:70px;
            height:70px;
            margin:auto;
            border:8px solid rgba(255,255,255,.2);
            border-top:8px solid #22c55e;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }

        .status{
            margin-top:30px;
            display:inline-block;
            background:#16a34a;
            padding:10px 22px;
            border-radius:30px;
            font-weight:bold;
            animation:pulse 1.5s infinite;
        }

        @keyframes pulse{
            0%{
                transform:scale(1);
                opacity:1;
            }
            50%{
                transform:scale(1.05);
                opacity:.8;
            }
            100%{
                transform:scale(1);
                opacity:1;
            }
        }

        .dots::after{
            content:"";
            animation:dots 1.5s steps(4,end) infinite;
        }

        @keyframes dots{
            0%{content:"";}
            25%{content:".";}
            50%{content:"..";}
            75%{content:"...";}
            100%{content:"";}
        }
    </style>
</head>
<body>

<div class="container">

    <div class="spinner"></div>

    <h1>🚀 Hmm<span class="dots"></span></h1>

    <p>The pipeline is running.<br>
    Please wait while the deployment is in progress.</p>

    <div class="status">
        ⏳ Pipeline Running
    </div>

</div>

</body>
</html>
